name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-build-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build project
        run: |
          go build ./...
          go build -o bin/linter ./cmd/loglinter

      - name: Install golangci-lint
        env:
          GOBIN: ${{ github.workspace }}/bin
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.1

      - name: Build custom golangci-lint
        run: ./bin/golangci-lint custom --destination ./bin --name custom-gcl --version v2.10.1

      - name: Run linter
        run: ./bin/custom-gcl run -c .golangci.yml ./...
